name: Publish package managers

# Decoupled from release.yml: only runs once a draft is promoted to a published
# release. At that point the assets (msi / nsis / portable zip / latest.json)
# are stable and public, so winget and Scoop can consume them. A failure here
# never rolls back an already published release, and failed jobs can be rerun
# on their own.
#
# The guard refuses to distribute a release without the automated verification
# PASS marker written by release.yml. It is a second line of defence: a hand-
# made Release or a [BLOCKED] draft that was published by mistake reaches users
# through latest.json, but at least cannot spread through package managers.

on:
  release:
    types: [published]

permissions:
  contents: write   # only for `gh release download` in the Scoop job;
                    # winget uses WINGET_TOKEN, Scoop pushes with SCOOP_BUCKET_TOKEN

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require automated verification
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag and a PASS marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft that lost its tag during annotation would publish as
          # `untagged-*`; refuse to distribute anything that is not vX.Y.Z.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $GITHUB_REF_NAME is not a vX.Y.Z version tag."
            echo "A draft that lost its tag (untagged-*) must not be published."
            exit 1
          fi
          BODY=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          if ! grep -q '<!-- tockola-verify: PASS' <<< "$BODY"; then
            echo "::error::$GITHUB_REF_NAME was not produced by the verified release pipeline."
            echo "Hand-made releases and drafts marked [BLOCKED] must not be distributed."
            exit 1
          fi
          echo "automated verification PASS confirmed for $GITHUB_REF_NAME"

  winget:
    name: Submit to winget (PR to microsoft/winget-pkgs)
    needs: guard
    runs-on: windows-latest   # winget-releaser requires a Windows runner
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v1
        with:
          identifier: Galivea.Tockola
          # No explicit version: the action strips the v prefix from the release
          # tag (v0.0.1 -> 0.0.1), matching what wingetcreate registered.
          # A classic PAT (public_repo + workflow) is required; GITHUB_TOKEN
          # cannot fork/push microsoft/winget-pkgs and fine-grained PATs are
          # not supported by this action.
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: '\.msi$'
          # fork-user defaults to github.repository_owner = galivea, which owns
          # galivea/winget-pkgs. Add fork-user explicitly if the fork ever moves
          # back to a personal account.

  scoop:
    name: Publish to Scoop bucket (galivea/scoop-bucket)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Download portable zip, compute hash, write manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          ASSET="tockola_${VER}_x64_portable.zip"
          gh release download "$TAG" -p "$ASSET" -D ./dl
          HASH=$(sha256sum "./dl/$ASSET" | awk '{print $1}')
          URL="https://github.com/galivea/tockola/releases/download/$TAG/$ASSET"
          jq -n \
            --arg v "$VER" \
            --arg url "$URL" \
            --arg hash "$HASH" \
            '{version:$v, description:"Cron-powered GUI for Windows Task Scheduler, focused on the tasks you created.", homepage:"https://github.com/galivea/tockola", license:"MIT", architecture:{64bit:{url:$url, hash:$hash}}, bin:"tockola.exe", checkver:"github", autoupdate:{architecture:{64bit:{url:$url}}}}' > tockola.json
          cat tockola.json

      - name: Push to galivea/scoop-bucket
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$TOKEN" ]; then
            echo "::error::SCOOP_BUCKET_TOKEN secret is not set; cannot push to galivea/scoop-bucket"
            exit 1
          fi
          git clone https://x-access-token:${TOKEN}@github.com/galivea/scoop-bucket.git bucket
          cp tockola.json bucket/
          cd bucket
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # An empty bucket may not have a HEAD ref yet, and a bare `git push`
          # can land the manifest on a branch other than the default one.
          BRANCH=$(gh api repos/galivea/scoop-bucket --jq '.default_branch')
          git add tockola.json
          if git diff --cached --quiet; then
            echo "manifest unchanged; nothing to commit"
          else
            git commit -m "tockola $VER"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
