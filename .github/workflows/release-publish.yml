name: Publish package managers

# Decoupled from release.yml: runs when a draft is promoted to a published
# release, and can also be dispatched manually for an already published tag.
# At that point the assets (msi / nsis / portable zip / latest.json) are stable
# and public, so winget and Scoop can consume them. A failure here never rolls
# back an already published release, and failed jobs can be rerun on their own.
#
# The guard refuses to distribute a release without the automated verification
# PASS marker written by release.yml. It is a second line of defence: a hand-
# made Release or a [BLOCKED] draft that was published by mistake reaches users
# through latest.json, but at least cannot spread through package managers.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an already published release to distribute, e.g. v0.0.1'
        required: true
        type: string

permissions:
  contents: write   # gh release download in the Scoop job uses GITHUB_TOKEN;
                    # winget uses WINGET_TOKEN, Scoop pushes with
                    # SCOOP_BUCKET_TOKEN (or falls back to WINGET_TOKEN)

env:
  # These jobs do not check out the repository, so gh cannot infer the target
  # repository from a local git remote. Without GH_REPO every `gh release ...`
  # call fails with "fatal: not a git repository" before any API request.
  GH_REPO: ${{ github.repository }}
  # release events carry the tag in the payload; manual runs carry it as an input.
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require automated verification
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag and a PASS marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft that lost its tag during annotation would publish as
          # `untagged-*`; refuse to distribute anything that is not vX.Y.Z.
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' is not a vX.Y.Z version tag."
            echo "A draft that lost its tag (untagged-*) must not be published."
            exit 1
          fi
          BODY=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          if ! grep -q '<!-- tockola-verify: PASS' <<< "$BODY"; then
            echo "::error::$RELEASE_TAG was not produced by the verified release pipeline."
            echo "Hand-made releases and drafts marked [BLOCKED] must not be distributed."
            exit 1
          fi
          echo "automated verification PASS confirmed for $RELEASE_TAG"

  winget:
    name: Submit to winget (PR to microsoft/winget-pkgs)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the package is already registered
        id: registration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # winget-releaser can only update an existing package. A first
          # version is registered by submitting multi-file manifests as a PR
          # (winget-create's `new` is an interactive wizard with no --submit;
          # `--submit` belongs to `update` and only works for registered
          # packages), then reviewed by Microsoft. Skip with a clear notice
          # instead of failing the whole run on the very first release.
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/g/Galivea/Tockola")
          case "$STATUS" in
            200) echo "registered=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "registered=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected HTTP $STATUS while checking winget-pkgs"; exit 1 ;;
          esac

      - name: Report the first-submission requirement
        if: steps.registration.outputs.registered == 'false'
        run: |
          echo "::notice title=Winget first submission required::Galivea.Tockola is not in microsoft/winget-pkgs yet. Submit the first version's multi-file manifests as a PR and let Microsoft review it; this workflow opens update PRs automatically once the package is registered."

      - name: Submit manifest update
        if: steps.registration.outputs.registered == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Galivea.Tockola
          # The action defaults to github.ref_name, which is `master` for a
          # workflow_dispatch run. Always pass the resolved release tag.
          release-tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: '\.msi$'
          # fork-user defaults to github.repository_owner = galivea, which owns
          # galivea/winget-pkgs. Add fork-user explicitly if the fork ever moves
          # back to a personal account.

  scoop:
    name: Publish to Scoop bucket (galivea/scoop-bucket)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Download portable zip, compute hash, write manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          VER="${TAG#v}"
          ASSET="tockola_${VER}_x64_portable.zip"
          gh release download "$TAG" -p "$ASSET" -D ./dl
          if ! test -s "./dl/$ASSET"; then
            echo "::error::downloaded asset $ASSET is missing or empty"
            exit 1
          fi
          HASH=$(sha256sum "./dl/$ASSET" | awk '{print $1}')
          URL="https://github.com/galivea/tockola/releases/download/$TAG/$ASSET"
          jq -n \
            --arg v "$VER" \
            --arg url "$URL" \
            --arg hash "$HASH" \
            '{version:$v, description:"Cron-powered GUI for Windows Task Scheduler, focused on the tasks you created.", homepage:"https://github.com/galivea/tockola", license:"MIT", architecture:{"64bit":{url:$url, hash:$hash}}, bin:"tockola.exe", checkver:"github", autoupdate:{architecture:{"64bit":{url:"https://github.com/galivea/tockola/releases/download/v$version/tockola_$version_x64_portable.zip"}}}}' > tockola.json
          jq -e 'has("version") and (.architecture["64bit"].hash | length == 64)' tockola.json > /dev/null
          cat tockola.json

      - name: Push to galivea/scoop-bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          # WINGET_TOKEN is a classic PAT with public_repo + workflow. The bucket
          # is public, so it can push there too. Prefer the dedicated fine-grained
          # token when present, but do not hard-fail on a first release just
          # because that one extra Secret has not been configured yet.
          WINGET_PAT: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${RELEASE_TAG#v}"
          if [ -n "$BUCKET_TOKEN" ]; then
            TOKEN="$BUCKET_TOKEN"
            echo "using SCOOP_BUCKET_TOKEN for the Scoop bucket push"
          elif [ -n "$WINGET_PAT" ]; then
            TOKEN="$WINGET_PAT"
            echo "SCOOP_BUCKET_TOKEN is unset; falling back to WINGET_TOKEN (classic PAT, public_repo) for the public bucket"
          else
            echo "::error::neither SCOOP_BUCKET_TOKEN nor WINGET_TOKEN is set; cannot push to galivea/scoop-bucket"
            exit 1
          fi
          git clone https://x-access-token:${TOKEN}@github.com/galivea/scoop-bucket.git bucket
          cp tockola.json bucket/
          cd bucket
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          # An empty bucket may not have a HEAD ref yet, and a bare `git push`
          # can land the manifest on a branch other than the default one.
          BRANCH=$(gh api repos/galivea/scoop-bucket --jq '.default_branch')
          git add tockola.json
          if git diff --cached --quiet; then
            echo "manifest unchanged; nothing to commit"
          else
            git commit -m "tockola $VER"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
